version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: roomrent-app
    container_name: roomrent_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - roomrent-net

  web:
    image: nginx:alpine
    container_name: roomrent_web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - roomrent-net

  db:
    image: mysql:8.0
    container_name: roomrent_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-roomrent}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_USER: ${DB_USERNAME:-roomrent}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - roomrent-net

networks:
  roomrent-net:
    driver: bridge

volumes:
  dbdata:
    driver: local
